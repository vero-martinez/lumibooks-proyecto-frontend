<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="starGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="40%" stop-color="#FFDF00" />
      <stop offset="100%" stop-color="#F1A800" />
    </radialGradient>
    
    <linearGradient id="starBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA500" />
      <stop offset="100%" stop-color="#D47A00" />
    </linearGradient>

    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA2B7" />
      <stop offset="100%" stop-color="#D85273" />
    </linearGradient>
  </defs>

  <style>
    .sparkle { fill: #FFA2B7; }
    .white-sparkle { fill: #FFFFFF; }
  </style>

  <g id="star-group">
    <path d="M 250,15 L 315,160 L 475,175 L 355,285 L 390,445 L 250,365 L 110,445 L 145,285 L 25,175 L 185,160 Z" 
          fill="url(#starGrad)" stroke="url(#starBorder)" stroke-width="8" stroke-linejoin="round" />
    
    <ellipse cx="250" cy="110" rx="6" ry="15" fill="#FFFFFF" opacity="0.7" transform="rotate(15 250 110)" />
    <path d="M 420,200 Q 440,210 435,225" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M 80,200 Q 60,210 65,225" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    
    <path d="M 250,90 Q 250,110 265,110 Q 250,110 250,130 Q 250,110 235,110 Q 250,110 250,90 Z" fill="#FFFFFF" />
    
    <circle cx="210" cy="140" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="295" cy="135" r="2" fill="#FFFFFF" opacity="0.8" />
    <circle cx="170" cy="350" r="3" fill="#FFFFFF" opacity="0.8" />
    <circle cx="310" cy="370" r="4" fill="#FFFFFF" opacity="0.9" />
    <path d="M 330,380 Q 340,395 335,410" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7" />
    <path d="M 170,380 Q 160,395 165,410" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  </g>

  <g id="magic-sparkles">
    <path d="M 160,110 Q 145,90 140,100" fill="none" stroke="#FFA2B7" stroke-width="5" stroke-linecap="round" />
    <path d="M 195,85 Q 190,65 180,70" fill="none" stroke="#FFA2B7" stroke-width="5" stroke-linecap="round" />
    <path d="M 305,85 Q 310,65 320,70" fill="none" stroke="#FFA2B7" stroke-width="5" stroke-linecap="round" />
    <path d="M 340,110 Q 355,90 360,100" fill="none" stroke="#FFA2B7" stroke-width="5" stroke-linecap="round" />
  </g>

  <g id="book-group">
    <path d="M 250,380 Q 190,340 70,290 L 110,165 Q 210,210 250,235 Q 290,210 390,165 L 430,290 Q 310,340 250,380 Z" 
          fill="url(#pinkGrad)" stroke="#B33652" stroke-width="4" stroke-linejoin="round" />

    <path d="M 250,370 Q 195,333 80,285 L 117,160 Q 212,203 250,225 Q 288,203 383,160 L 420,285 Q 305,333 250,370 Z" 
          fill="#FFF0F3" />

    <path d="M 246,365 Q 195,330 87,280 L 122,158 Q 212,200 246,220 Z" 
          fill="#FFFFFF" stroke="#D85273" stroke-width="3" stroke-linejoin="round" />
    
    <path d="M 254,365 Q 305,330 413,280 L 378,158 Q 288,200 254,220 Z" 
          fill="#FFFFFF" stroke="#D85273" stroke-width="3" stroke-linejoin="round" />

    <path d="M 145,195 L 225,230 M 135,230 L 225,270 M 125,265 L 205,300" 
          stroke="#FFA2B7" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <path d="M 355,195 L 275,230 M 365,230 L 275,270 M 375,265 L 295,300" 
          stroke="#FFA2B7" stroke-width="6" stroke-linecap="round" opacity="0.8" />
          
    <path d="M 250,220 L 250,370" stroke="#D85273" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
